add_bonus:
  fields:
    child:
      required: true
      example: "Alex"
      selector:
        text:
    device:
      example: "Pixel 8"
      selector:
        text:
    minutes:
      required: true
      default: 30
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box

revoke_bonus:
  fields:
    child:
      required: true
      selector:
        text:
    device:
      selector:
        text:

lock:
  fields:
    child:
      required: true
      selector:
        text:
    device:
      selector:
        text:

unlock:
  fields:
    child:
      required: true
      selector:
        text:
    device:
      selector:
        text:

ring:
  fields:
    child:
      required: true
      selector:
        text:
    device:
      selector:
        text:

refresh_location:
  fields:
    child:
      required: true
      selector:
        text:

set_app:
  fields:
    child:
      required: true
      selector:
        text:
    app:
      required: true
      example: "com.google.android.youtube"
      selector:
        text:
    mode:
      required: true
      selector:
        select:
          translation_key: app_mode
          options:
            - limit
            - block
            - always_allow
            - default
    minutes:
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
          mode: box

emergency:
  fields:
    child:
      required: true
      selector:
        text:
    device:
      selector:
        text:
    message:
      example: "Call me back right now please."
      selector:
        text:
          multiline: true
    ring:
      default: true
      selector:
        boolean:
    notify_service:
      example: "notify.mobile_app_pixel_8"
      selector:
        text:
    refresh_location:
      default: false
      selector:
        boolean:

refresh:
  fields:
    child:
      selector:
        text:

school_mode:
  fields:
    child:
      required: true
      selector:
        text:
    enable:
      required: true
      default: true
      selector:
        boolean:

set_schedule:
  fields:
    child:
      required: true
      selector:
        text:
    kind:
      required: true
      selector:
        select:
          translation_key: schedule_kind
          options:
            - bedtime
            - school_time
    days:
      required: true
      selector:
        select:
          translation_key: weekday
          multiple: true
          options: [mon, tue, wed, thu, fri, sat, sun]
    start:
      selector:
        time:
    end:
      selector:
        time:
    enable:
      selector:
        boolean:

schedule_today:
  fields:
    child:
      required: true
      selector:
        text:
    kind:
      required: true
      selector:
        select:
          translation_key: schedule_kind
          options:
            - bedtime
            - school_time
    enable:
      required: true
      default: false
      selector:
        boolean:
    start:
      selector:
        time:
    end:
      selector:
        time:

set_daily_limit:
  fields:
    child:
      required: true
      selector:
        text:
    minutes:
      required: true
      selector:
        number:
          min: 0
          max: 1440
          step: 5
          unit_of_measurement: min
          mode: box
    days:
      selector:
        select:
          translation_key: weekday
          multiple: true
          options: [mon, tue, wed, thu, fri, sat, sun]
    devices:
      selector:
        text:
          multiple: true
